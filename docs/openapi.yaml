openapi: 3.1.0
info:
  title: Loomora API
  version: 1.0.0
  description: |
    Backend API for Loomora (docs/09-api-design.md is the design; this file is the contract).

    - JSON only. Dates are `YYYY-MM-DD`, timestamps ISO 8601 UTC (`2026-10-24T03:00:00Z`).
    - Auth: Sanctum **bearer tokens** (`Authorization: Bearer <token>`), valid 30 days.
    - The user's local "today" is sent by the client as `?date=YYYY-MM-DD`.
    - Rate limits: `/auth/*` public routes 10 per minute per IP; signed-in routes 120 per minute per user.
    - Errors always use `{ "message": "...", "errors": { "field": ["..."] } }` (`errors` only on 422).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8000/api/v1
    description: Local
tags:
  - name: System
    description: Health and status.
  - name: Auth
    description: Sign up, sign in, email verification and password reset.
  - name: Me
    description: The signed-in user's account.
  - name: Todos
    description: To-dos and the Today list.
  - name: Schedule
    description: The fixed weekly schedule.
  - name: Import
    description: Moving guest data into an account.
  - name: Streak
    description: Days in a row with something checked off.
security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Health check
      security: []
      responses:
        '200':
          description: The API is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
              example:
                status: ok

  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Create an account and sign in
      description: Also sends the verification email. A mail failure does not block signup.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: Sokha
              email: sokha@example.com
              password: correct-horse-battery
              timezone: Asia/Phnom_Penh
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                default:
                  $ref: '#/components/examples/TokenResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: sokha@example.com
              password: correct-horse-battery
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                default:
                  $ref: '#/components/examples/TokenResponse'
        '422':
          description: Wrong email or password (reported on `email`), or invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: These credentials do not match our records.
                errors:
                  email: [These credentials do not match our records.]
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/google/redirect:
    get:
      tags: [Auth]
      operationId: googleRedirect
      summary: Start Google sign-in
      description: |
        Open this URL in the browser (full page, not fetch). Redirects to Google, then back to
        `/auth/google/callback`. `timezone` is used only when a new account is created (default `UTC`).
      security: []
      parameters:
        - name: intent
          in: query
          required: true
          schema:
            type: string
            enum: [sign_in, sign_up]
        - name: timezone
          in: query
          required: false
          schema:
            type: string
          example: Asia/Phnom_Penh
      responses:
        '302':
          description: Redirect to Google.
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/google/callback:
    get:
      tags: [Auth]
      operationId: googleCallback
      summary: Google returns here
      description: |
        Called by Google, not by the app. Always redirects to `{FRONTEND_URL}/auth/google/callback` with either
        `?code=<one-time code>` or `?error=` one of `account_not_found` (sign_in, no account),
        `account_already_exists` (sign_up, account exists), `email_not_verified`, `google_failed`.
      security: []
      responses:
        '302':
          description: Redirect to the frontend with `code` or `error`.
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/google/exchange:
    post:
      tags: [Auth]
      operationId: googleExchange
      summary: Trade the one-time code for a token
      description: The code works once and expires after 5 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  minLength: 64
                  maxLength: 64
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                default:
                  $ref: '#/components/examples/TokenResponse'
        '422':
          description: Invalid, used or expired code (reported on `code`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current token
      description: Other devices stay signed in.
      responses:
        '204':
          description: Signed out.
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /auth/email/verify:
    post:
      tags: [Auth]
      operationId: verifyEmail
      summary: Confirm an email address
      description: |
        Public: the link may be opened on a signed-out device. The email links to
        `{FRONTEND_URL}/verify-email?id=&expires=&signature=`; the frontend posts those three values here.
        Links expire after 24 hours and stop working if the email changes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, expires, signature]
              properties:
                id:
                  type: string
                  format: uuid
                expires:
                  type: integer
                  description: Unix timestamp.
                signature:
                  type: string
                  minLength: 64
                  maxLength: 64
            example:
              id: 9f1c2d3e-4b5a-4c6d-8e7f-0a1b2c3d4e5f
              expires: 1793001600
              signature: 3f6c0e0b5e8a4f1d9c2b7a6e5d4c3b2a1f0e9d8c7b6a5f4e3d2c1b0a9f8e7d6c
      responses:
        '200':
          description: Email confirmed (also when it was already confirmed).
          content:
            application/json:
              schema:
                type: object
                required: [message, user]
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '422':
          description: Invalid or expired link (reported on `signature`), or missing fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/email/resend:
    post:
      tags: [Auth]
      operationId: resendVerification
      summary: Send the verification email again
      description: Limited to 3 per 10 minutes per user. Sends nothing if already verified.
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/password/forgot:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Email a password reset link
      description: |
        Same answer whether or not the email has an account. The email links to
        `{FRONTEND_URL}/reset-password?token=&email=`. Links last 60 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
            example:
              email: sokha@example.com
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/password/reset:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Set a new password with a reset token
      description: Signs out every device (all tokens are revoked).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password]
              properties:
                token:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
            example:
              token: 5f2b1c...
              email: sokha@example.com
              password: new-password-456
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '422':
          description: Invalid, used or expired token (reported on `token`), or invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /me:
    get:
      tags: [Me]
      operationId: getMe
      summary: The signed-in user
      responses:
        '200':
          description: The current user, wrapped in `data`.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
              examples:
                default:
                  $ref: '#/components/examples/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /todos:
    get:
      tags: [Todos]
      operationId: listTodayTodos
      summary: The Today list
      description: |
        To-dos due on `date` (done or not), undated to-dos that are not done, and overdue
        to-dos (due before `date`, not done). Future-dated to-dos are hidden until their day.
        Sorted overdue first, then by due date, then by creation time.
      parameters:
        - name: date
          in: query
          required: true
          description: The user's local date. Must be within one day of today in the user's time zone.
          schema:
            type: string
            format: date
          example: '2026-10-24'
      responses:
        '200':
          description: The list.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Todo'
              example:
                data:
                  - id: 2b7e1a90-5c3d-4f2e-9a1b-0c8d7e6f5a4b
                    title: Finish essay draft
                    category: study
                    due_date: '2026-10-20'
                    done_at: null
                    overdue: true
                    old: false
                    created_at: '2026-10-19T08:00:00Z'
                  - id: 7c4d2e1f-0a9b-4c8d-8e7f-6a5b4c3d2e1f
                    title: Gym
                    category: health
                    due_date: '2026-10-24'
                    done_at: '2026-10-24T03:00:00Z'
                    overdue: false
                    old: false
                    created_at: '2026-10-24T01:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Todos]
      operationId: createTodo
      summary: Create a to-do
      description: At most 500 to-dos per user (reported on `title`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoInput'
            example:
              title: Read chapter 3
              category: study
              due_date: '2026-10-24'
      responses:
        '201':
          $ref: '#/components/responses/TodoResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /todos/{todo}:
    parameters:
      - $ref: '#/components/parameters/TodoId'
    patch:
      tags: [Todos]
      operationId: updateTodo
      summary: Edit a to-do
      description: Send only the fields to change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                category:
                  $ref: '#/components/schemas/Category'
                due_date:
                  type: [string, 'null']
                  format: date
            example:
              title: Read chapter 4
              due_date: null
      responses:
        '200':
          $ref: '#/components/responses/TodoResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Todos]
      operationId: deleteTodo
      summary: Delete a to-do
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /todos/{todo}/done:
    parameters:
      - $ref: '#/components/parameters/TodoId'
    post:
      tags: [Todos]
      operationId: markTodoDone
      summary: Check off a to-do
      description: Sets `done_at`. Calling it again keeps the first completion time.
      responses:
        '200':
          $ref: '#/components/responses/TodoResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Todos]
      operationId: markTodoUndone
      summary: Undo a check-off
      description: Clears `done_at`.
      responses:
        '200':
          $ref: '#/components/responses/TodoResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /schedule/items:
    get:
      tags: [Schedule]
      operationId: listScheduleItems
      summary: The repeat definitions
      description: All of the user's schedule items, ordered by start time.
      responses:
        '200':
          description: The items.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScheduleItem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [Schedule]
      operationId: createScheduleItem
      summary: Create a schedule item
      description: |
        One item covers every ticked weekday. `start_time` must be before `end_time`.
        At most 100 items per user (reported on `title`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleItemInput'
            example:
              title: Math class
              category: study
              start_time: '08:00'
              end_time: '09:30'
              days: [0, 2, 4]
      responses:
        '201':
          $ref: '#/components/responses/ScheduleItemResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /schedule/items/{item}:
    parameters:
      - $ref: '#/components/parameters/ScheduleItemId'
    patch:
      tags: [Schedule]
      operationId: updateScheduleItem
      summary: Edit all repeats
      description: Send only the fields to change. Times and dates are checked against the stored values.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                category:
                  $ref: '#/components/schemas/Category'
                start_time:
                  $ref: '#/components/schemas/Time'
                end_time:
                  $ref: '#/components/schemas/Time'
                days:
                  $ref: '#/components/schemas/Weekdays'
                starts_on:
                  type: string
                  format: date
                ends_on:
                  type: [string, 'null']
                  format: date
            example:
              days: [5, 6]
      responses:
        '200':
          $ref: '#/components/responses/ScheduleItemResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Schedule]
      operationId: deleteScheduleItem
      summary: Delete all repeats
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /schedule/day:
    get:
      tags: [Schedule]
      operationId: getScheduleDay
      summary: Occurrences for one date
      description: Repeats applied to the date, skips removed, overrides merged, `done` from check-ins. Sorted by start time.
      parameters:
        - $ref: '#/components/parameters/DateQuery'
      responses:
        '200':
          description: The occurrences.
          content:
            application/json:
              schema:
                type: object
                required: [date, data]
                properties:
                  date:
                    type: string
                    format: date
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Occurrence'
              example:
                date: '2026-10-26'
                data:
                  - item_id: 5d0c1e2a-7b3f-4c1d-9a8e-1f2b3c4d5e6f
                    date: '2026-10-26'
                    title: Math class
                    category: study
                    start_time: '08:00'
                    end_time: '09:30'
                    done: false
                    overridden: false
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /schedule/week:
    get:
      tags: [Schedule]
      operationId: getScheduleWeek
      summary: Occurrences for seven days
      description: Seven consecutive days starting at `start`.
      parameters:
        - name: start
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: One entry per day.
          content:
            application/json:
              schema:
                type: object
                required: [start, data]
                properties:
                  start:
                    type: string
                    format: date
                  data:
                    type: array
                    minItems: 7
                    maxItems: 7
                    items:
                      type: object
                      required: [date, occurrences]
                      properties:
                        date:
                          type: string
                          format: date
                        occurrences:
                          type: array
                          items:
                            $ref: '#/components/schemas/Occurrence'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /schedule/now:
    get:
      tags: [Schedule]
      operationId: getScheduleNow
      summary: Now and next
      description: |
        `now` starts at or before `time` and ends after it (end is exclusive). `next` is the first occurrence
        starting later that day. Either is `null` when there is none (the client shows "Free" and
        "Nothing more today"). `date` must be within one day of the user's today.
      parameters:
        - $ref: '#/components/parameters/DateQuery'
        - name: time
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Time'
      responses:
        '200':
          description: Now and next.
          content:
            application/json:
              schema:
                type: object
                required: [now, next]
                properties:
                  now:
                    oneOf:
                      - $ref: '#/components/schemas/Occurrence'
                      - type: 'null'
                  next:
                    oneOf:
                      - $ref: '#/components/schemas/Occurrence'
                      - type: 'null'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /schedule/copy-day:
    post:
      tags: [Schedule]
      operationId: copyScheduleDay
      summary: Copy one weekday to others
      description: Every item that runs on `from_weekday` also runs on `to_weekdays`. Returns the changed items.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_weekday, to_weekdays]
              properties:
                from_weekday:
                  type: integer
                  minimum: 0
                  maximum: 6
                to_weekdays:
                  type: array
                  minItems: 1
                  items:
                    type: integer
                    minimum: 0
                    maximum: 6
            example:
              from_weekday: 0
              to_weekdays: [1, 2]
      responses:
        '200':
          description: The items that changed.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScheduleItem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /schedule/items/{item}/exceptions/{date}:
    parameters:
      - $ref: '#/components/parameters/ScheduleItemId'
      - $ref: '#/components/parameters/DatePath'
    put:
      tags: [Schedule]
      operationId: putScheduleException
      summary: Skip or override one day
      description: |
        Replaces any earlier exception for that day. The item must occur on `date`.
        An override needs a `title` or a time and the final times must keep start before end.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [skip, override]
                title:
                  type: [string, 'null']
                  maxLength: 200
                start_time:
                  oneOf:
                    - $ref: '#/components/schemas/Time'
                    - type: 'null'
                end_time:
                  oneOf:
                    - $ref: '#/components/schemas/Time'
                    - type: 'null'
            example:
              type: override
              title: Exam
              start_time: '10:00'
              end_time: '12:00'
      responses:
        '200':
          description: The stored exception.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [item_id, date, type]
                    properties:
                      item_id:
                        type: string
                        format: uuid
                      date:
                        type: string
                        format: date
                      type:
                        type: string
                        enum: [skip, override]
                      title:
                        type: [string, 'null']
                      start_time:
                        type: [string, 'null']
                      end_time:
                        type: [string, 'null']
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Schedule]
      operationId: deleteScheduleException
      summary: Restore that day
      description: Safe to repeat.
      responses:
        '204':
          description: Restored.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /schedule/items/{item}/checkins/{date}:
    parameters:
      - $ref: '#/components/parameters/ScheduleItemId'
      - $ref: '#/components/parameters/DatePath'
    post:
      tags: [Schedule]
      operationId: checkInScheduleOccurrence
      summary: Mark an occurrence done
      description: The item must occur on `date` and not be skipped. `201` the first time, `200` if already done.
      responses:
        '200':
          $ref: '#/components/responses/CheckinResponse'
        '201':
          $ref: '#/components/responses/CheckinResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Schedule]
      operationId: undoScheduleCheckin
      summary: Undo a check-in
      description: Safe to repeat.
      responses:
        '204':
          description: Undone.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /streak:
    get:
      tags: [Streak]
      operationId: getStreak
      summary: Current and longest streak
      description: |
        Recomputes the streak (docs/08 rule 8) and stores it on the user. `date` is the user's local today and
        must be within one day of it in their time zone. Today is never judged: it only adds 1 once something
        is checked off (`today_counted`). Checking off or undoing a to-do or schedule occurrence also recomputes it.
      parameters:
        - $ref: '#/components/parameters/DateQuery'
      responses:
        '200':
          description: The streak.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [current_streak, longest_streak, today_counted]
                    properties:
                      current_streak:
                        type: integer
                        minimum: 0
                      longest_streak:
                        type: integer
                        minimum: 0
                      today_counted:
                        type: boolean
              example:
                data:
                  current_streak: 4
                  longest_streak: 9
                  today_counted: true
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /import:
    post:
      tags: [Import]
      operationId: importGuestData
      summary: Import guest data
      description: |
        Moves a guest's local data into the account in one transaction (docs/08 rule 9). Every row carries the
        UUID the client gave it. Nothing is written if any row is invalid (422 with the row in the error key,
        for example `todos.1.title`). Safe to send again: rows the user already has (same id, or the same item
        and day for exceptions and check-ins) are left untouched and counted as `skipped`. An id that belongs
        to another account is a 422. Limits: 500 to-dos and 100 schedule items per user in total, 5000 exceptions
        and 10000 check-ins per call. Exceptions and check-ins must point at an item in the payload or one the user has.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                todos:
                  type: array
                  items:
                    type: object
                    required: [id, title]
                    properties:
                      id: {type: string, format: uuid}
                      title: {type: string, minLength: 1, maxLength: 200}
                      category: {$ref: '#/components/schemas/Category'}
                      due_date: {type: [string, 'null'], format: date}
                      done_at: {type: [string, 'null'], format: date-time}
                      created_at: {type: [string, 'null'], format: date-time}
                schedule_items:
                  type: array
                  items:
                    type: object
                    required: [id, title, start_time, end_time, days]
                    properties:
                      id: {type: string, format: uuid}
                      title: {type: string, minLength: 1, maxLength: 200}
                      category: {$ref: '#/components/schemas/Category'}
                      start_time: {$ref: '#/components/schemas/Time'}
                      end_time: {$ref: '#/components/schemas/Time'}
                      days: {$ref: '#/components/schemas/Weekdays'}
                      starts_on: {type: string, format: date}
                      ends_on: {type: [string, 'null'], format: date}
                      created_at: {type: [string, 'null'], format: date-time}
                exceptions:
                  type: array
                  items:
                    type: object
                    required: [id, schedule_item_id, date, type]
                    properties:
                      id: {type: string, format: uuid}
                      schedule_item_id: {type: string, format: uuid}
                      date: {type: string, format: date}
                      type: {type: string, enum: [skip, override]}
                      title: {type: [string, 'null']}
                      start_time: {oneOf: [{$ref: '#/components/schemas/Time'}, {type: 'null'}]}
                      end_time: {oneOf: [{$ref: '#/components/schemas/Time'}, {type: 'null'}]}
                checkins:
                  type: array
                  items:
                    type: object
                    required: [id, schedule_item_id, date]
                    properties:
                      id: {type: string, format: uuid}
                      schedule_item_id: {type: string, format: uuid}
                      date: {type: string, format: date}
                      done_at: {type: [string, 'null'], format: date-time}
            example:
              todos:
                - id: 3b9a6c1e-2d4f-4a8b-9c0d-1e2f3a4b5c6d
                  title: Buy pens
                  category: life
                  due_date: '2026-10-26'
              schedule_items:
                - id: 5d0c1e2a-7b3f-4c1d-9a8e-1f2b3c4d5e6f
                  title: Math class
                  category: study
                  start_time: '08:00'
                  end_time: '09:30'
                  days: [0, 2]
              exceptions: []
              checkins: []
      responses:
        '200':
          description: What was created and what was already there.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [todos, schedule_items, exceptions, checkins]
                    properties:
                      todos: {type: object, required: [created, skipped], properties: {created: {type: integer}, skipped: {type: integer}}}
                      schedule_items: {type: object, required: [created, skipped], properties: {created: {type: integer}, skipped: {type: integer}}}
                      exceptions: {type: object, required: [created, skipped], properties: {created: {type: integer}, skipped: {type: integer}}}
                      checkins: {type: object, required: [created, skipped], properties: {created: {type: integer}, skipped: {type: integer}}}
              example:
                data:
                  todos: {created: 1, skipped: 0}
                  schedule_items: {created: 1, skipped: 0}
                  exceptions: {created: 0, skipped: 0}
                  checkins: {created: 0, skipped: 0}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Sanctum personal access token from register or login. Expires after 30 days.

  parameters:
    DateQuery:
      name: date
      in: query
      required: true
      description: The user's local date.
      schema:
        type: string
        format: date
    DatePath:
      name: date
      in: path
      required: true
      schema:
        type: string
        format: date
    ScheduleItemId:
      name: item
      in: path
      required: true
      description: Schedule item UUID. A value that is not a UUID returns 404.
      schema:
        type: string
        format: uuid
    TodoId:
      name: todo
      in: path
      required: true
      description: To-do UUID. A value that is not a UUID returns 404.
      schema:
        type: string
        format: uuid

  schemas:
    Occurrence:
      type: object
      required: [item_id, date, title, category, start_time, end_time, done, overridden]
      properties:
        item_id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        title:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        start_time:
          $ref: '#/components/schemas/Time'
        end_time:
          $ref: '#/components/schemas/Time'
        done:
          type: boolean
        overridden:
          type: boolean
          description: True when a one-day override changed this occurrence.
    Time:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      description: Local time, `HH:MM` (24 h).
      examples: ['08:00']

    Weekdays:
      type: array
      minItems: 1
      maxItems: 7
      uniqueItems: true
      description: Weekdays the item repeats on. 0 = Monday ... 6 = Sunday.
      items:
        type: integer
        minimum: 0
        maximum: 6

    ScheduleItemInput:
      type: object
      required: [title, start_time, end_time, days]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        category:
          $ref: '#/components/schemas/Category'
          description: Defaults to `other`.
        start_time:
          $ref: '#/components/schemas/Time'
        end_time:
          $ref: '#/components/schemas/Time'
        days:
          $ref: '#/components/schemas/Weekdays'
        starts_on:
          type: string
          format: date
          description: Defaults to today in the user's time zone.
        ends_on:
          type: [string, 'null']
          format: date
          description: Must be on or after `starts_on`.

    ScheduleItem:
      type: object
      required: [id, title, category, start_time, end_time, days, starts_on, ends_on, created_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        start_time:
          $ref: '#/components/schemas/Time'
        end_time:
          $ref: '#/components/schemas/Time'
        days:
          $ref: '#/components/schemas/Weekdays'
        starts_on:
          type: string
          format: date
        ends_on:
          type: [string, 'null']
          format: date
        created_at:
          type: string
          format: date-time

    Category:
      type: string
      enum: [study, work, health, life, rest, other]

    RegisterRequest:
      type: object
      required: [name, email, password, timezone]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 255
          description: Stored lower-case. Must be unique.
        password:
          type: string
          minLength: 8
        timezone:
          type: string
          description: IANA time zone name.
          examples: [Asia/Phnom_Penh]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    User:
      type: object
      required: [id, name, email, email_verified_at, timezone, goal, heard_from, survey_done, current_streak, longest_streak, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        email_verified_at:
          type: [string, 'null']
          format: date-time
        timezone:
          type: string
        goal:
          type: [string, 'null']
          enum: [be_consistent, manage_time, finish_tasks, other, null]
        heard_from:
          type: [string, 'null']
        survey_done:
          type: boolean
        current_streak:
          type: integer
          minimum: 0
        longest_streak:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time

    TokenResponse:
      type: object
      required: [token, expires_at, user]
      description: Returned by register and login. Note the user is NOT wrapped in `data` here.
      properties:
        token:
          type: string
          description: "Send as `Authorization: Bearer <token>`."
        expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'

    TodoInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Leading and trailing spaces are trimmed.
        category:
          $ref: '#/components/schemas/Category'
          description: Defaults to `other`.
        due_date:
          type: [string, 'null']
          format: date

    Todo:
      type: object
      required: [id, title, category, due_date, done_at, overdue, old, created_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        due_date:
          type: [string, 'null']
          format: date
        done_at:
          type: [string, 'null']
          format: date-time
        overdue:
          type: boolean
          description: Computed. Due before the user's today and not done.
        old:
          type: boolean
          description: Computed. Overdue for more than 30 days.
        created_at:
          type: string
          format: date-time

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string

    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

  responses:
    CheckinResponse:
      description: The check-in.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [item_id, date, done, done_at]
                properties:
                  item_id:
                    type: string
                    format: uuid
                  date:
                    type: string
                    format: date
                  done:
                    type: boolean
                  done_at:
                    type: string
                    format: date-time
    ScheduleItemResponse:
      description: The schedule item, wrapped in `data`.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/ScheduleItem'
          example:
            data:
              id: 4e2a1b3c-5d6e-4f70-8a9b-0c1d2e3f4a5b
              title: Math class
              category: study
              start_time: '08:00'
              end_time: '09:30'
              days: [0, 2, 4]
              starts_on: '2026-10-25'
              ends_on: null
              created_at: '2026-10-24T23:30:00Z'
    Message:
      description: Done. A human-readable message.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: If an account exists for that email, we sent a reset link.
    TodoResponse:
      description: The to-do, wrapped in `data`.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/Todo'
    ValidationError:
      description: Invalid input.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            message: The title field is required.
            errors:
              title: [The title field is required.]
    Unauthenticated:
      description: Missing, invalid or expired token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Unauthenticated.
    Forbidden:
      description: The item belongs to another user.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: This action is unauthorized.
    NotFound:
      description: No such item.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Not found.
    TooManyRequests:
      description: Rate limit hit. Retry after the `Retry-After` header.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Too Many Attempts.

  examples:
    MeResponse:
      value:
        data:
          id: 9f1c2d3e-4b5a-4c6d-8e7f-0a1b2c3d4e5f
          name: Sokha
          email: sokha@example.com
          email_verified_at: null
          timezone: Asia/Phnom_Penh
          goal: null
          heard_from: null
          survey_done: false
          current_streak: 0
          longest_streak: 0
          created_at: '2026-10-24T03:00:00Z'
    TokenResponse:
      value:
        token: 1|Xb7kQ2...
        expires_at: '2026-11-23T03:00:00Z'
        user:
          id: 9f1c2d3e-4b5a-4c6d-8e7f-0a1b2c3d4e5f
          name: Sokha
          email: sokha@example.com
          email_verified_at: null
          timezone: Asia/Phnom_Penh
          goal: null
          heard_from: null
          survey_done: false
          current_streak: 0
          longest_streak: 0
          created_at: '2026-10-24T03:00:00Z'
