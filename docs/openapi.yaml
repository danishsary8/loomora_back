openapi: 3.1.0
info:
  title: Loomora API
  version: 1.0.0
  description: |
    Backend API for Loomora (docs/09-api-design.md is the design; this file is the contract).

    - JSON only. Dates are `YYYY-MM-DD`, timestamps ISO 8601 UTC (`2026-10-24T03:00:00Z`).
    - Auth: Sanctum **bearer tokens** (`Authorization: Bearer <token>`), valid 30 days.
    - The user's local "today" is sent by the client as `?date=YYYY-MM-DD`.
    - Rate limits: `/auth/*` public routes 10 per minute per IP; signed-in routes 120 per minute per user.
    - CORS authorizes only the configured frontend origin and omits the credentials header. Google callback, email verification and password reset links use the same origin.
    - An invalid frontend origin prevents startup. If HTTP reaches a misconfigured API instance, it responds with HTTP 500 and `{"message":"Server Error"}`.
    - Once the API boots successfully, responses, including CORS preflights, carry `X-Content-Type-Options`, `X-Frame-Options`, `Referrer-Policy` and `Content-Security-Policy`.
      HTTPS responses also carry `Strict-Transport-Security`.
    - Errors always use `{ "message": "...", "errors": { "field": ["..."] } }` (`errors` only on 422).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8000/api/v1
    description: Local
tags:
  - name: System
    description: Health and status.
  - name: Auth
    description: Sign up, sign in, email verification and password reset.
  - name: Me
    description: The signed-in user's account.
  - name: Todos
    description: To-dos and the Today list.
  - name: Reminders
    description: In-app reminders for to-dos. No push notifications yet.
  - name: Feedback
    description: Messages from users and guests.
  - name: Schedule
    description: The fixed weekly schedule.
  - name: Import
    description: Moving guest data into an account.
  - name: Days
    description: Things the user sets for a single day.
  - name: Analytics
    description: Daily Focus, to-do and schedule metrics.
  - name: Streak
    description: Days in a row with something checked off.
  - name: Notes
    description: Standalone and schedule-block notes.
  - name: Focus
    description: Finished Focus sessions (countdown with breaks, or stopwatch with laps).
security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Health check
      description: Cheap by default (used by Render). With `deep=1` it also checks the database connection.
      security: []
      parameters:
        - name: deep
          in: query
          required: false
          description: Set to `1` to also check the database.
          schema:
            type: integer
            enum: [0, 1]
      responses:
        '200':
          description: The API (and, with `deep=1`, the database) is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
                  database:
                    type: string
                    const: ok
                    description: Only present with `deep=1`.
              examples:
                basic:
                  value:
                    status: ok
                deep:
                  value:
                    status: ok
                    database: ok
        '503':
          description: Only with `deep=1`, the database could not be reached.
          content:
            application/json:
              schema:
                type: object
                required: [status, database]
                properties:
                  status:
                    type: string
                    const: error
                  database:
                    type: string
                    const: unavailable

  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Create an account and sign in
      description: Also sends the verification email. A mail failure does not block signup.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: Sokha
              email: sokha@example.com
              password: correct-horse-battery
              timezone: Asia/Phnom_Penh
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                default:
                  $ref: '#/components/examples/TokenResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: sokha@example.com
              password: correct-horse-battery
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                default:
                  $ref: '#/components/examples/TokenResponse'
        '422':
          description: Wrong email or password (reported on `email`), or invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: These credentials do not match our records.
                errors:
                  email: [These credentials do not match our records.]
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/google/redirect:
    get:
      tags: [Auth]
      operationId: googleRedirect
      summary: Start Google sign-in
      description: |
        Open this URL in the browser (full page, not fetch). Redirects to Google, then back to
        `/auth/google/callback`. `timezone` is used only when a new account is created (default `UTC`).
      security: []
      parameters:
        - name: intent
          in: query
          required: true
          schema:
            type: string
            enum: [sign_in, sign_up]
        - name: timezone
          in: query
          required: false
          schema:
            type: string
          example: Asia/Phnom_Penh
      responses:
        '302':
          description: Redirect to Google.
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/google/callback:
    get:
      tags: [Auth]
      operationId: googleCallback
      summary: Google returns here
      description: |
        Google calls this endpoint. It redirects to `{FRONTEND_URL}/auth/google/callback` with either
        `?code=<one-time code>` or `?error=` one of `account_not_found` (sign_in, no account),
        `account_already_exists` (sign_up, account exists), `email_not_verified`, `google_failed`
        (including when the email account is already linked to a different Google subject).
      security: []
      responses:
        '302':
          description: Redirect to the frontend with `code` or `error`.
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/google/exchange:
    post:
      tags: [Auth]
      operationId: googleExchange
      summary: Trade the one-time code for a token
      description: |
        The code works once and expires after 5 minutes. A newer Google callback, successful
        password reset, or account deletion invalidates the outstanding code.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  minLength: 64
                  maxLength: 64
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                default:
                  $ref: '#/components/examples/TokenResponse'
        '422':
          description: Invalid, used, replaced, revoked or expired code (reported on `code`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current token
      description: Other devices stay signed in.
      responses:
        '204':
          description: Signed out.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/email/verify:
    post:
      tags: [Auth]
      operationId: verifyEmail
      summary: Confirm an email address
      description: |
        Public: the link may be opened on a signed-out device. The email links to
        `{FRONTEND_URL}/verify-email?id=&expires=&signature=`; the frontend posts those three values here.
        Links expire after 24 hours and stop working if the email changes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, expires, signature]
              properties:
                id:
                  type: string
                  format: uuid
                expires:
                  type: integer
                  description: Unix timestamp.
                signature:
                  type: string
                  minLength: 64
                  maxLength: 64
            example:
              id: 9f1c2d3e-4b5a-4c6d-8e7f-0a1b2c3d4e5f
              expires: 1793001600
              signature: 3f6c0e0b5e8a4f1d9c2b7a6e5d4c3b2a1f0e9d8c7b6a5f4e3d2c1b0a9f8e7d6c
      responses:
        '200':
          description: Email confirmed (also when it was already confirmed).
          content:
            application/json:
              schema:
                type: object
                required: [message, user]
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '422':
          description: Invalid or expired link (reported on `signature`), or missing fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/email/resend:
    post:
      tags: [Auth]
      operationId: resendVerification
      summary: Send the verification email again
      description: Limited to 3 per 10 minutes per user. Sends nothing if already verified.
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/password/forgot:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Email a password reset link
      description: |
        Same answer whether or not the email has an account. The email links to
        `{FRONTEND_URL}/reset-password?token=&email=`. Links last 60 minutes and are
        valid only for the account associated with the address at issuance. The response acknowledges the
        request even if the mail transport fails.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
            example:
              email: sokha@example.com
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/password/reset:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Set a new password with a reset token
      description: Revokes all bearer tokens for the account and invalidates its outstanding Google exchange code.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password]
              properties:
                token:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
            example:
              token: 5f2b1c...
              email: sokha@example.com
              password: new-password-456
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '422':
          description: Invalid, used or expired token (reported on `token`), or invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /me:
    get:
      tags: [Me]
      operationId: getMe
      summary: The signed-in user
      description: A request authorized before credential revocation may still complete.
      responses:
        '200':
          description: The current user, wrapped in `data`.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
              examples:
                default:
                  $ref: '#/components/examples/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    patch:
      tags: [Me]
      operationId: updateMe
      summary: Change name or time zone
      description: Send only the fields to change. Other fields are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                timezone:
                  type: string
                  description: IANA time zone name.
                time_format:
                  type: string
                  enum: ['12h', '24h']
                week_starts_on:
                  type: integer
                  minimum: 1
                  maximum: 7
                  description: 1 = Monday to 7 = Sunday.
            example:
              timezone: Europe/Paris
              time_format: 12h
              week_starts_on: 7
      responses:
        '200':
          $ref: '#/components/responses/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Me]
      operationId: deleteMe
      summary: Delete the account and all its data
      description: |
        Requires the current password when the account has one, including linked Google accounts.
        Eligible Google-only accounts use a confirmed Google deletion challenge with the original
        bearer and browser verifier. The Google method is disabled by default and requires the
        canonical frontend Origin and a JSON body. A password-only request without a configured
        password returns 422 on password. The account and its database credentials and data are
        deleted in one transaction. Google final submissions are limited to five attempts per
        account and 30 per IP in ten minutes.
      parameters:
        - name: Origin
          in: header
          description: Required for Google confirmation. Must exactly match the canonical frontend origin.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [password]
                  properties:
                    google_confirmation: false
                    password:
                      type: string
                - type: object
                  required: [google_confirmation]
                  properties:
                    password: false
                    google_confirmation:
                      type: object
                      additionalProperties: false
                      required: [challenge_id, browser_verifier]
                      properties:
                        challenge_id:
                          type: string
                          format: uuid
                        browser_verifier:
                          $ref: '#/components/schemas/GoogleDeletionBrowserSecret'
            examples:
              password:
                value:
                  password: correct-horse-battery
              google:
                value:
                  google_confirmation:
                    challenge_id: 0a067241-1242-4689-99aa-65c3b937fceb
                    browser_verifier: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaA
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/GoogleDeletionForbidden'
        '415':
          $ref: '#/components/responses/GoogleDeletionJsonRequired'
        '422':
          description: Invalid input, incompatible methods, password validation failure, or invalid Google confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Deletion failed. Changes made by the deletion transaction are rolled back.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/GoogleDeletionUnavailable'

  /me/deletion/google/challenge:
    post:
      tags: [Me]
      operationId: startGoogleDeletion
      summary: Start Google authentication for account deletion
      description: |
        Creates a five-minute challenge and supersedes the account's prior attempt. The authorization
        URL redirects through Google to the fixed frontend /auth/google/deletion/callback route.
        Only accounts linked to Google with no Loomora password are eligible.
        Limited to three starts per account and ten per IP in ten minutes.
        Disabled until paired staging verifies the callback and signed Google authentication time.
      parameters:
        - $ref: '#/components/parameters/GoogleDeletionOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [browser_challenge]
              properties:
                browser_challenge:
                  allOf:
                    - $ref: '#/components/schemas/GoogleDeletionBrowserSecret'
                  description: Base64url SHA-256 digest of the initiating tab's verifier string.
      responses:
        '201':
          description: Challenge created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, authorization_url, expires_at]
                    properties:
                      id:
                        type: string
                        format: uuid
                      authorization_url:
                        type: string
                        format: uri
                      expires_at:
                        type: string
                        format: date-time
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/GoogleDeletionForbidden'
        '415':
          $ref: '#/components/responses/GoogleDeletionJsonRequired'
        '422':
          $ref: '#/components/responses/GoogleDeletionValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/GoogleDeletionFailure'
        '503':
          $ref: '#/components/responses/GoogleDeletionUnavailable'

  /me/deletion/google/verify:
    post:
      tags: [Me]
      operationId: verifyGoogleDeletion
      summary: Confirm Google authentication for account deletion
      description: |
        Exchanges the code and verifies a signed Google ID token with a recent auth_time.
        The request must come from the initiating tab and carry the original bearer.
        Limited to five attempts per account and 30 per IP in ten minutes, independently from final DELETE.
        Disabled until paired staging verifies the callback and signed Google authentication time.
      parameters:
        - $ref: '#/components/parameters/GoogleDeletionOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id, code, state, browser_verifier]
              properties:
                challenge_id:
                  type: string
                  format: uuid
                code:
                  type: string
                  minLength: 1
                  maxLength: 2048
                  description: Google authorization code received on the dedicated callback.
                state:
                  $ref: '#/components/schemas/GoogleDeletionBrowserSecret'
                browser_verifier:
                  $ref: '#/components/schemas/GoogleDeletionBrowserSecret'
      responses:
        '200':
          description: Confirmed. An explicit final DELETE is still required.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, expires_at]
                    properties:
                      id:
                        type: string
                        format: uuid
                      expires_at:
                        type: string
                        format: date-time
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/GoogleDeletionForbidden'
        '415':
          $ref: '#/components/responses/GoogleDeletionJsonRequired'
        '422':
          $ref: '#/components/responses/GoogleDeletionValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/GoogleDeletionFailure'
        '503':
          $ref: '#/components/responses/GoogleDeletionUnavailable'
  /me/survey:
    post:
      tags: [Me]
      operationId: submitSurvey
      summary: Answer (or skip) the sign-up survey
      description: Both answers are optional; an empty body means "skip". Either way `survey_done` becomes true.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                goal:
                  type: [string, 'null']
                  enum: [be_consistent, manage_time, finish_tasks, other, null]
                heard_from:
                  type: [string, 'null']
                  maxLength: 500
            example:
              goal: manage_time
              heard_from: A friend
      responses:
        '200':
          $ref: '#/components/responses/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /feedback:
    post:
      tags: [Feedback]
      operationId: sendFeedback
      summary: Send feedback
      description: |
        Works for guests and signed-in users (send the token to link the message to the account).
        Stored, then emailed to the team. Limited to 10 per hour.
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 5000
            example:
              message: The progress ring is lovely.
      responses:
        '201':
          $ref: '#/components/responses/Message'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /todos:
    get:
      tags: [Todos]
      operationId: listTodayTodos
      summary: The Today list
      description: |
        To-dos due on `date` (done or not), undated to-dos that are not done, and overdue
        to-dos (due before `date`, not done). Future-dated to-dos are hidden until their day.
        Sorted overdue first, then by due date, then by creation time. Only top-level to-dos are listed;
        each carries its subtasks (done or not) in `subtasks`, oldest first.
      parameters:
        - name: date
          in: query
          required: true
          description: The user's local date. Must be within one day of today in the user's time zone.
          schema:
            type: string
            format: date
          example: '2026-10-24'
      responses:
        '200':
          description: The list.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Todo'
              example:
                data:
                  - id: 2b7e1a90-5c3d-4f2e-9a1b-0c8d7e6f5a4b
                    title: Finish essay draft
                    category: study
                    priority: high
                    notes: Use the library sources.
                    parent_id: null
                    repeat_rule: null
                    next_todo_id: null
                    remind_at: null
                    due_date: '2026-10-20'
                    done_at: null
                    overdue: true
                    old: false
                    created_at: '2026-10-19T08:00:00Z'
                    subtasks:
                      - id: 9d1e2f3a-4b5c-4d6e-8f7a-1b2c3d4e5f6a
                        title: Write the outline
                        category: study
                        priority: normal
                        notes: null
                        parent_id: 2b7e1a90-5c3d-4f2e-9a1b-0c8d7e6f5a4b
                        repeat_rule: null
                        next_todo_id: null
                        remind_at: null
                        due_date: null
                        done_at: '2026-10-24T02:00:00Z'
                        overdue: false
                        old: false
                        created_at: '2026-10-19T08:05:00Z'
                        subtasks: []
                  - id: 7c4d2e1f-0a9b-4c8d-8e7f-6a5b4c3d2e1f
                    title: Gym
                    category: health
                    priority: normal
                    notes: null
                    parent_id: null
                    repeat_rule: {type: weekly, days: [0, 2, 4]}
                    next_todo_id: 4e5f6a7b-8c9d-4e0f-a1b2-c3d4e5f6a7b8
                    remind_at: null
                    due_date: '2026-10-24'
                    done_at: '2026-10-24T03:00:00Z'
                    overdue: false
                    old: false
                    created_at: '2026-10-24T01:00:00Z'
                    subtasks: []
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Todos]
      operationId: createTodo
      summary: Create a to-do or a subtask
      description: |
        At most 500 to-dos per user, subtasks included (reported on `title`).
        Send `parent_id` to create a subtask. The parent must be one of the user's own top-level to-dos:
        another user's or an unknown id is a 404, and a parent that is itself a subtask is a 422 on `parent_id`.
        A subtask takes its parent's category unless one is sent, and cannot have a `due_date` (422).
        A to-do with a `repeat_rule` needs a `due_date` (422 on `due_date`); a subtask cannot repeat (422 on `repeat_rule`)
        or have a `remind_at` (422 on `remind_at`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoInput'
            example:
              title: Read chapter 3
              category: study
              priority: high
              due_date: '2026-10-24'
      responses:
        '201':
          $ref: '#/components/responses/TodoResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /todos/{todo}:
    parameters:
      - $ref: '#/components/parameters/TodoId'
    patch:
      tags: [Todos]
      operationId: updateTodo
      summary: Edit a to-do
      description: |
        Send only the fields to change. `parent_id` cannot be changed. A subtask cannot get a `due_date` or a
        `repeat_rule` (422). A repeating to-do must keep a `due_date`: clearing it, or adding a rule to an undated
        to-do, is a 422 on `due_date`. Send `repeat_rule: null` to stop repeating. A subtask cannot get a `remind_at` (422).
        A `remind_at` different from the current one brings back a dismissed reminder; `remind_at: null` removes it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                category:
                  $ref: '#/components/schemas/Category'
                due_date:
                  type: [string, 'null']
                  format: date
                priority:
                  $ref: '#/components/schemas/Priority'
                notes:
                  type: [string, 'null']
                  maxLength: 2000
                repeat_rule:
                  oneOf:
                    - $ref: '#/components/schemas/RepeatRule'
                    - type: 'null'
                remind_at:
                  $ref: '#/components/schemas/RemindAt'
            example:
              title: Read chapter 4
              due_date: null
              priority: low
      responses:
        '200':
          $ref: '#/components/responses/TodoResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Todos]
      operationId: deleteTodo
      summary: Delete a to-do
      description: |
        Soft delete: hides the to-do and its subtasks everywhere. It can be restored with
        `POST /todos/{todo}/restore` for 7 days. Account deletion removes every row, deleted ones included.
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /todos/{todo}/restore:
    parameters:
      - $ref: '#/components/parameters/TodoId'
    post:
      tags: [Todos]
      operationId: restoreTodo
      summary: Restore a deleted to-do
      description: |
        Brings back a to-do deleted less than 7 days ago, with the same id, together with the subtasks that were
        deleted along with it (not ones deleted on their own earlier). A to-do that is not deleted is returned
        unchanged. Another user's to-do is a 404. A subtask cannot be restored while its parent is still deleted (422).
      responses:
        '200':
          $ref: '#/components/responses/TodoResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: The to-do was deleted 7 days ago or more and can no longer be restored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'

  /todos/{todo}/done:
    parameters:
      - $ref: '#/components/parameters/TodoId'
    post:
      tags: [Todos]
      operationId: markTodoDone
      summary: Check off a to-do
      description: |
        Sets `done_at`. Calling it again keeps the first completion time. Checking off a parent also checks
        off its open subtasks with the same time; subtasks already done keep theirs. Subtask check-offs count
        for the streak like any to-do.

        For a repeating to-do, the first check-off also creates the next one in the same transaction and returns
        its id in `next_todo_id`: same title, category, priority, notes and rule, plus undone copies of the
        subtasks. Its `due_date` is the next date matching the rule after the later of the old due date and
        today in the user's time zone. Its `remind_at` moves by the same number of days as the due date, so the
        reminder keeps its distance from the due date; it is null when the checked-off to-do had none, and a
        dismissed reminder is not carried over. Unchecking and checking off again does not create another.
      responses:
        '200':
          $ref: '#/components/responses/TodoResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Todos]
      operationId: markTodoUndone
      summary: Undo a check-off
      description: Clears `done_at`. Unchecking a parent leaves its subtasks as they are.
      responses:
        '200':
          $ref: '#/components/responses/TodoResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /reminders/due:
    get:
      tags: [Reminders]
      operationId: listDueReminders
      summary: Reminders that are due now
      description: |
        The user's to-dos that are not done, whose `remind_at` has passed and whose reminder was not dismissed,
        oldest `remind_at` first, at most 50. The client polls this while the app is open and shows each one
        until it is dismissed or snoozed.
      responses:
        '200':
          description: The due reminders.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    maxItems: 50
                    items:
                      $ref: '#/components/schemas/Todo'
              example:
                data:
                  - id: 2b7e1a90-5c3d-4f2e-9a1b-0c8d7e6f5a4b
                    title: Call the bank
                    category: life
                    priority: normal
                    notes: null
                    parent_id: null
                    repeat_rule: null
                    next_todo_id: null
                    remind_at: '2026-10-24T03:00:00Z'
                    due_date: '2026-10-24'
                    done_at: null
                    overdue: false
                    old: false
                    created_at: '2026-10-23T08:00:00Z'
                    subtasks: []
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /todos/{todo}/reminder/dismiss:
    parameters:
      - $ref: '#/components/parameters/TodoId'
    post:
      tags: [Reminders]
      operationId: dismissReminder
      summary: Dismiss a reminder
      description: |
        Removes the to-do from the due list; `remind_at` is kept. Calling it again keeps the first dismissal.
        Setting a different `remind_at` (edit or snooze) brings the reminder back.
        Another user's to-do is a 404.
      responses:
        '200':
          $ref: '#/components/responses/TodoResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /todos/{todo}/reminder/snooze:
    parameters:
      - $ref: '#/components/parameters/TodoId'
    post:
      tags: [Reminders]
      operationId: snoozeReminder
      summary: Snooze a reminder
      description: |
        Sets `remind_at` to now plus `minutes` and clears a dismissal. Another user's to-do is a 404;
        a subtask is a 422 on `remind_at` (subtasks have no reminders).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minutes]
              properties:
                minutes:
                  type: integer
                  enum: [5, 10, 30, 60]
            example:
              minutes: 10
      responses:
        '200':
          $ref: '#/components/responses/TodoResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /schedule/items:
    get:
      tags: [Schedule]
      operationId: listScheduleItems
      summary: The repeat definitions
      description: All of the user's schedule items, ordered by start time.
      responses:
        '200':
          description: The items.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScheduleItem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [Schedule]
      operationId: createScheduleItem
      summary: Create a schedule item
      description: |
        One item covers every ticked weekday. `start_time` must be before `end_time`.
        At most 100 items per user (reported on `title`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleItemInput'
            example:
              title: Math class
              category: study
              start_time: '08:00'
              end_time: '09:30'
              days: [0, 2, 4]
      responses:
        '201':
          $ref: '#/components/responses/ScheduleItemResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /schedule/items/{item}:
    parameters:
      - $ref: '#/components/parameters/ScheduleItemId'
    patch:
      tags: [Schedule]
      operationId: updateScheduleItem
      summary: Edit all repeats
      description: Send only the fields to change. Times and dates are checked against the stored values.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                category:
                  $ref: '#/components/schemas/Category'
                start_time:
                  $ref: '#/components/schemas/Time'
                end_time:
                  $ref: '#/components/schemas/Time'
                days:
                  $ref: '#/components/schemas/Weekdays'
                starts_on:
                  type: string
                  format: date
                ends_on:
                  type: [string, 'null']
                  format: date
            example:
              days: [5, 6]
      responses:
        '200':
          $ref: '#/components/responses/ScheduleItemResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Schedule]
      operationId: deleteScheduleItem
      summary: Delete all repeats
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /schedule/day:
    get:
      tags: [Schedule]
      operationId: getScheduleDay
      summary: Occurrences for one date
      description: Repeats applied to the date, skips removed, overrides merged, `done` from check-ins. Sorted by start time.
      parameters:
        - $ref: '#/components/parameters/DateQuery'
      responses:
        '200':
          description: The occurrences.
          content:
            application/json:
              schema:
                type: object
                required: [date, data]
                properties:
                  date:
                    type: string
                    format: date
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Occurrence'
              example:
                date: '2026-10-26'
                data:
                  - item_id: 5d0c1e2a-7b3f-4c1d-9a8e-1f2b3c4d5e6f
                    date: '2026-10-26'
                    title: Math class
                    category: study
                    start_time: '08:00'
                    end_time: '09:30'
                    done: false
                    overridden: false
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /schedule/week:
    get:
      tags: [Schedule]
      operationId: getScheduleWeek
      summary: Occurrences for seven days
      description: Seven consecutive days starting at `start`.
      parameters:
        - name: start
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: One entry per day.
          content:
            application/json:
              schema:
                type: object
                required: [start, data]
                properties:
                  start:
                    type: string
                    format: date
                  data:
                    type: array
                    minItems: 7
                    maxItems: 7
                    items:
                      type: object
                      required: [date, occurrences]
                      properties:
                        date:
                          type: string
                          format: date
                        occurrences:
                          type: array
                          items:
                            $ref: '#/components/schemas/Occurrence'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /schedule/now:
    get:
      tags: [Schedule]
      operationId: getScheduleNow
      summary: Now and next
      description: |
        `now` starts at or before `time` and ends after it (end is exclusive). `next` is the first occurrence
        starting later that day. Either is `null` when there is none (the client shows "Free" and
        "Nothing more today"). `date` must be within one day of the user's today.
      parameters:
        - $ref: '#/components/parameters/DateQuery'
        - name: time
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Time'
      responses:
        '200':
          description: Now and next.
          content:
            application/json:
              schema:
                type: object
                required: [now, next]
                properties:
                  now:
                    oneOf:
                      - $ref: '#/components/schemas/Occurrence'
                      - type: 'null'
                  next:
                    oneOf:
                      - $ref: '#/components/schemas/Occurrence'
                      - type: 'null'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /schedule/copy-day:
    post:
      tags: [Schedule]
      operationId: copyScheduleDay
      summary: Copy one weekday to others
      description: Every item that runs on `from_weekday` also runs on `to_weekdays`. Returns the changed items.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_weekday, to_weekdays]
              properties:
                from_weekday:
                  type: integer
                  minimum: 0
                  maximum: 6
                to_weekdays:
                  type: array
                  minItems: 1
                  items:
                    type: integer
                    minimum: 0
                    maximum: 6
            example:
              from_weekday: 0
              to_weekdays: [1, 2]
      responses:
        '200':
          description: The items that changed.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScheduleItem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /schedule/items/{item}/exceptions/{date}:
    parameters:
      - $ref: '#/components/parameters/ScheduleItemId'
      - $ref: '#/components/parameters/DatePath'
    put:
      tags: [Schedule]
      operationId: putScheduleException
      summary: Skip or override one day
      description: |
        Replaces any earlier exception for that day. The item must occur on `date`.
        An override needs a `title` or a time and the final times must keep start before end.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [skip, override]
                title:
                  type: [string, 'null']
                  maxLength: 200
                start_time:
                  oneOf:
                    - $ref: '#/components/schemas/Time'
                    - type: 'null'
                end_time:
                  oneOf:
                    - $ref: '#/components/schemas/Time'
                    - type: 'null'
            example:
              type: override
              title: Exam
              start_time: '10:00'
              end_time: '12:00'
      responses:
        '200':
          description: The stored exception.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [item_id, date, type]
                    properties:
                      item_id:
                        type: string
                        format: uuid
                      date:
                        type: string
                        format: date
                      type:
                        type: string
                        enum: [skip, override]
                      title:
                        type: [string, 'null']
                      start_time:
                        type: [string, 'null']
                      end_time:
                        type: [string, 'null']
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Schedule]
      operationId: deleteScheduleException
      summary: Restore that day
      description: Safe to repeat.
      responses:
        '204':
          description: Restored.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /schedule/items/{item}/checkins/{date}:
    parameters:
      - $ref: '#/components/parameters/ScheduleItemId'
      - $ref: '#/components/parameters/DatePath'
    post:
      tags: [Schedule]
      operationId: checkInScheduleOccurrence
      summary: Mark an occurrence done
      description: The item must occur on `date` and not be skipped. `201` the first time, `200` if already done.
      responses:
        '200':
          $ref: '#/components/responses/CheckinResponse'
        '201':
          $ref: '#/components/responses/CheckinResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Schedule]
      operationId: undoScheduleCheckin
      summary: Undo a check-in
      description: Safe to repeat.
      responses:
        '204':
          description: Undone.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /days/{date}/intention:
    parameters:
      - $ref: '#/components/parameters/DatePath'
    get:
      tags: [Days]
      operationId: getDailyIntention
      summary: The intention for a day
      description: |
        One short line the user sets for a local day. `text` is null when none is set. `date` must be a real
        `Y-m-d` date within 366 days of the user's today (before or after); otherwise 422.
      responses:
        '200':
          $ref: '#/components/responses/IntentionResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
    put:
      tags: [Days]
      operationId: putDailyIntention
      summary: Set or clear the intention for a day
      description: |
        Creates the intention or replaces the existing one (one per user and day). `text` must be sent: up to
        200 characters after trimming. An empty string, blank text or null deletes it. Same date rules as GET.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: [string, 'null']
                  maxLength: 200
            example:
              text: Finish the essay outline
      responses:
        '200':
          $ref: '#/components/responses/IntentionResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /notes:
    get:
      tags: [Notes]
      operationId: listNotes
      summary: List the account's live notes, newest update first
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
      responses:
        '200':
          description: Up to 50 live notes and links to adjacent pages.
          content:
            application/json:
              schema:
                type: object
                required: [data, links, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Note'
                  links:
                    type: object
                    properties:
                      prev: { type: [string, 'null'] }
                      next: { type: [string, 'null'] }
                  meta:
                    type: object
                    properties:
                      current_page: { type: integer }
                      per_page: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [Notes]
      operationId: createNote
      summary: Create a standalone or schedule-block note
      description: A title or body is required. An occurrence date requires an owned schedule block.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteInput'
      responses:
        '201':
          description: The created note.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Note'
        '409':
          description: The client UUID is already in use.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /notes/{note}:
    parameters:
      - in: path
        name: note
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Notes]
      operationId: getNote
      summary: Read an account note
      responses:
        '200':
          description: The note.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Note'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags: [Notes]
      operationId: updateNote
      summary: Edit an account note
      description: Supply null to clear a field. A changed block clears an omitted occurrence date. The resulting note must retain a title or body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteFields'
      responses:
        '200':
          description: The updated note.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Note'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [Notes]
      operationId: deleteNote
      summary: Soft-delete a note
      responses:
        '204':
          description: The note is deleted. Repeated deletion returns the same status.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /notes/{note}/restore:
    parameters:
      - in: path
        name: note
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Notes]
      operationId: restoreNote
      summary: Restore a note deleted less than seven days ago
      responses:
        '200':
          description: The restored note, or the current note if already active.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Note'
        '410':
          description: The note's undo window has expired.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /focus-sessions:
    get:
      tags: [Focus]
      operationId: listFocusSessions
      summary: Focus sessions for one local day
      description: |
        The user's own sessions whose `local_date` is `date`, oldest `started_at` first. A session that crosses
        local midnight belongs to the day it started. No pagination: one day's sessions.
      parameters:
        - $ref: '#/components/parameters/DateQuery'
      responses:
        '200':
          description: The day's sessions.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FocusSession'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Focus]
      operationId: recordFocusSession
      summary: Record one finished Focus session
      description: |
        Stores a finished session (completed or ended early) once. The browser runs the timer; this endpoint
        never starts, pauses or resumes one. The client-generated `id` is the idempotency key:

        - a new `id` stores the session: **201**;
        - the same `id` with an identical payload returns the stored session unchanged: **200** (equal instants
          and UUIDs written differently, such as `Z` and `+00:00`, are identical);
        - the same `id` with any other payload, or an `id` that belongs to another account: **409**, nothing changes.

        Durations are integer milliseconds. `focus_ms` (the tracked Focus time) is the sum of `active_ms` over
        `focus` segments; `break_ms` over break segments; `paused_ms` is the rest of the wall time. A session needs
        `focus_ms > 0`; there is no other minimum. Timestamps come from the client clock and are never compared
        with the server clock: a session recorded on a device whose clock is ahead or behind, or queued offline
        for a long time, is accepted as recorded. Only its internal consistency is validated. Payload bounds: 200
        segments, 1000 laps, a 200-character label; one more is a 422 on that field, never a silent truncation. `todo_id` must be the user's own to-do (a soft-deleted one is
        accepted). `schedule_item_id` must be the user's own existing schedule item. An unknown or another
        account's link is a 422 with the same message. The linked rows are checked after the replay check, so
        retrying an already stored session still returns 200 after its schedule item was deleted.
        An identical retry of a deleted session returns its stored payload with 200 and leaves it deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FocusSessionInput'
            examples:
              countdown:
                summary: 25 min focus, 5 min break, 25 min focus
                value:
                  id: 6f1c2a8e-3b4d-4e5f-8a9b-0c1d2e3f4a5b
                  mode: countdown
                  started_at: '2026-11-23T02:00:00.000Z'
                  ended_at: '2026-11-23T03:02:30.000Z'
                  end_reason: completed
                  planned_focus_ms: 1500000
                  todo_id: 1a2b3c4d-0000-4000-8000-000000000001
                  schedule_item_id: null
                  label: Read chapter 4
                  segments:
                    - {type: focus, started_at: '2026-11-23T02:00:00.000Z', ended_at: '2026-11-23T02:27:00.000Z', active_ms: 1500000}
                    - {type: short_break, started_at: '2026-11-23T02:27:00.000Z', ended_at: '2026-11-23T02:32:00.000Z', active_ms: 300000}
                    - {type: focus, started_at: '2026-11-23T02:32:00.000Z', ended_at: '2026-11-23T03:02:30.000Z', active_ms: 1500000}
                  laps: null
              stopwatch:
                summary: Stopwatch with three laps
                value:
                  id: 0b6f7a52-8f4c-4c1e-9d5a-3e2f1a0b9c8d
                  mode: stopwatch
                  started_at: '2026-11-23T02:00:00.000Z'
                  ended_at: '2026-11-23T02:03:10.010Z'
                  end_reason: completed
                  planned_focus_ms: null
                  label: null
                  segments:
                    - {type: focus, started_at: '2026-11-23T02:00:00.000Z', ended_at: '2026-11-23T02:03:10.010Z', active_ms: 190010}
                  laps: [61230, 125470, 190010]
      responses:
        '201':
          $ref: '#/components/responses/FocusSessionResponse'
        '200':
          $ref: '#/components/responses/FocusSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: The `id` already holds a different session, or belongs to another account. Do not retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: A different session was already saved with this id.
        '422':
          $ref: '#/components/responses/ValidationError'

  /focus-sessions/{focusSession}:
    parameters:
      - $ref: '#/components/parameters/FocusSessionId'
    get:
      tags: [Focus]
      operationId: getFocusSession
      summary: One active Focus session
      description: An unknown, deleted, or another user's session returns 404.
      responses:
        '200':
          $ref: '#/components/responses/FocusSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Focus]
      operationId: deleteFocusSession
      summary: Soft-delete a finished Focus session
      description: Deleted sessions are hidden from day lists and reads. A repeat delete keeps the original undo deadline.
      responses:
        '204':
          description: The session is deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /focus-sessions/{focusSession}/restore:
    parameters:
      - $ref: '#/components/parameters/FocusSessionId'
    post:
      tags: [Focus]
      operationId: restoreFocusSession
      summary: Restore a Focus session
      description: Restore an owned session deleted less than seven days ago. An already active session is returned as-is.
      responses:
        '200':
          $ref: '#/components/responses/FocusSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: The undo deadline has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /stats/summary:
    get:
      tags: [Analytics]
      operationId: getStatsSummary
      summary: Daily analytics and plan versus reality
      description: |
        Accepts calendar dates in years 0001 through 9999. Returns one row per date, including dates
        with no activity. Focus sessions use their stored local date, to-do completions
        use the account time zone, and to-dos due use their stored due date. Deleted
        to-dos are excluded. Planned block minutes and check-ins reflect the schedule
        after overrides and skips. Focus with a stored to-do or block link counts as
        linked; all other focus counts as unplanned. Historical streak values use current
        records and the account time zone. A completed to-do or schedule check-in counts;
        unplanned days are skipped and a missed planned day breaks the streak. The current
        local day is not judged until it ends. Deleted to-dos are excluded.
        Each value looks back at most 400 preceding days. The may_be_longer flag is true
        only for a positive streak when no missed planned day or supported calendar
        beginning establishes its start within that window. The value is then a lower
        bound and earlier completions could make it longer. A zero always has a false
        flag, including when older completions fall outside the window. A positive
        value with a false flag has a visible break or calendar boundary. No permanent
        history snapshots are stored.
      parameters:
        - in: query
          name: from
          required: true
          schema: { type: string, format: date }
        - in: query
          name: to
          required: true
          description: Must be on or after from and at most 91 days later.
          schema: { type: string, format: date }
      responses:
        '200':
          description: Daily and total metrics for the account.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [opening_streak, opening_streak_may_be_longer, days, totals, by_mode]
                    properties:
                      opening_streak: { type: integer, minimum: 0, description: Streak at the end of the local day preceding from. }
                      opening_streak_may_be_longer: { type: boolean, description: True when the positive opening streak could extend beyond the supported lookback. Zero always returns false. }
                      days:
                        type: array
                        minItems: 1
                        maxItems: 92
                        items:
                          allOf:
                            - $ref: '#/components/schemas/StatsMetrics'
                            - type: object
                              required: [local_date, streak, streak_may_be_longer]
                              properties:
                                local_date: { type: string, format: date }
                                streak: { type: integer, minimum: 0, description: Reconstructed streak at the end of this local day. }
                                streak_may_be_longer: { type: boolean, description: True when the positive streak could extend beyond the supported lookback. Zero always returns false. }
                      totals:
                        $ref: '#/components/schemas/StatsMetrics'
                      by_mode:
                        type: object
                        description: Total focus milliseconds by timer mode.
                        required: [countdown, stopwatch]
                        properties:
                          countdown: { type: integer, format: int64, minimum: 0 }
                          stopwatch: { type: integer, format: int64, minimum: 0 }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /streak:
    get:
      tags: [Streak]
      operationId: getStreak
      summary: Current and longest streak
      description: |
        Recomputes the streak (docs/08 rule 8) and stores it on the user. `date` is the user's local today and
        must be within one day of it in their time zone. Today is never judged: it only adds 1 once something
        is checked off (`today_counted`). Checking off or undoing a to-do or schedule occurrence also recomputes it.
      parameters:
        - $ref: '#/components/parameters/DateQuery'
      responses:
        '200':
          description: The streak.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [current_streak, longest_streak, today_counted]
                    properties:
                      current_streak:
                        type: integer
                        minimum: 0
                      longest_streak:
                        type: integer
                        minimum: 0
                      today_counted:
                        type: boolean
              example:
                data:
                  current_streak: 4
                  longest_streak: 9
                  today_counted: true
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /import:
    post:
      tags: [Import]
      operationId: importGuestData
      summary: Import guest data
      description: |
        Moves a guest's local data into the account, one transaction per call (docs/08 rule 9). A plan larger
        than one call is sent in chunks; a successful chunk stays committed even if a later one fails. Every row carries the
        UUID the client gave it. Nothing is written if any row is invalid (422 with the row in the error key,
        for example `todos.1.title`). Safe to send again: rows the user already has (same id, or the same item
        and day for exceptions and check-ins) are left untouched and counted as `skipped`. An id that belongs
        to another account is a 422. Limits: 500 to-dos, 100 schedule items, 5000 exceptions and 10000 check-ins
        per call. Per user, at most 500 manual to-dos and 100 schedule items in total (reported on `todos` or
        `schedule_items`). A repeat successor (a to-do another of the user's to-dos points at with `next_todo_id`,
        in the account or as a new row in the payload) and its subtasks do not count toward the 500; a `repeat_rule`
        alone does not exempt a to-do. Deleted to-dos never count, and re-sending one is `skipped`.
        Splitting to-dos across calls: `parent_id` and `next_todo_id` must point at a row the user already has or one
        in the same call, so a successor goes in the same call as its predecessor or an earlier one. A successor
        whose predecessor is not yet on the account or in the same call counts as manual for that call, and so do
        its subtasks. An order that always fits whenever the whole plan does: each repeat chain from the newest
        successor down to the original, each successor's subtasks right after that successor's predecessor, other
        to-dos anywhere with their subtasks after them, then cut into calls of at most 500 to-dos. Exceptions and check-ins must point at an item in the payload or one the user has.
        A to-do's `parent_id` must point at a top-level to-do in the payload or one the user has (in any order in the
        payload), and a subtask cannot have a `due_date` or a `repeat_rule`. A to-do with a `repeat_rule` needs a
        `due_date`. `next_todo_id` must point at a to-do in the payload or one the user has. A subtask cannot have a
        `remind_at`; send `remind_dismissed_at` for a reminder the guest already dismissed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                todos:
                  type: array
                  items:
                    type: object
                    required: [id, title]
                    properties:
                      id: {type: string, format: uuid}
                      title: {type: string, minLength: 1, maxLength: 200}
                      category: {$ref: '#/components/schemas/Category'}
                      due_date: {type: [string, 'null'], format: date}
                      done_at: {type: [string, 'null'], format: date-time}
                      created_at: {type: [string, 'null'], format: date-time}
                      priority: {$ref: '#/components/schemas/Priority'}
                      notes: {type: [string, 'null'], maxLength: 2000}
                      parent_id: {type: [string, 'null'], format: uuid}
                      repeat_rule: {oneOf: [{$ref: '#/components/schemas/RepeatRule'}, {type: 'null'}]}
                      next_todo_id: {type: [string, 'null'], format: uuid}
                      remind_at: {$ref: '#/components/schemas/RemindAt'}
                      remind_dismissed_at: {$ref: '#/components/schemas/RemindAt'}
                schedule_items:
                  type: array
                  items:
                    type: object
                    required: [id, title, start_time, end_time, days]
                    properties:
                      id: {type: string, format: uuid}
                      title: {type: string, minLength: 1, maxLength: 200}
                      category: {$ref: '#/components/schemas/Category'}
                      start_time: {$ref: '#/components/schemas/Time'}
                      end_time: {$ref: '#/components/schemas/Time'}
                      days: {$ref: '#/components/schemas/Weekdays'}
                      starts_on: {type: string, format: date}
                      ends_on: {type: [string, 'null'], format: date}
                      created_at: {type: [string, 'null'], format: date-time}
                exceptions:
                  type: array
                  items:
                    type: object
                    required: [id, schedule_item_id, date, type]
                    properties:
                      id: {type: string, format: uuid}
                      schedule_item_id: {type: string, format: uuid}
                      date: {type: string, format: date}
                      type: {type: string, enum: [skip, override]}
                      title: {type: [string, 'null']}
                      start_time: {oneOf: [{$ref: '#/components/schemas/Time'}, {type: 'null'}]}
                      end_time: {oneOf: [{$ref: '#/components/schemas/Time'}, {type: 'null'}]}
                checkins:
                  type: array
                  items:
                    type: object
                    required: [id, schedule_item_id, date]
                    properties:
                      id: {type: string, format: uuid}
                      schedule_item_id: {type: string, format: uuid}
                      date: {type: string, format: date}
                      done_at: {type: [string, 'null'], format: date-time}
                focus_sessions:
                  type: array
                  maxItems: 500
                  description: |
                    Finished guest sessions. Exclude deleted sessions and send linked to-dos
                    and schedule items in the same or an earlier request. UUIDs must be unique
                    within a request. An identical replay is skipped; a changed payload or an
                    ID already owned by another account returns 409 and rolls back the request.
                    An identical replay of an account-deleted session leaves it deleted.
                    Local dates and durations are calculated as for POST /focus-sessions.
                  items:
                    $ref: '#/components/schemas/FocusSessionInput'
                notes:
                  type: array
                  maxItems: 500
                  description: Send blocks before their notes or in the same request. Existing note UUIDs owned by the account are skipped, including deleted notes.
                  items:
                    $ref: '#/components/schemas/NoteImportInput'
                daily_intentions:
                  type: array
                  maxItems: 1000
                  description: One per day. A day the user already has an intention for is skipped (the server copy wins).
                  items:
                    type: object
                    required: [date, text]
                    properties:
                      date: {type: string, format: date}
                      text: {type: string, minLength: 1, maxLength: 200}
            example:
              todos:
                - id: 3b9a6c1e-2d4f-4a8b-9c0d-1e2f3a4b5c6d
                  title: Buy pens
                  category: life
                  due_date: '2026-10-26'
              schedule_items:
                - id: 5d0c1e2a-7b3f-4c1d-9a8e-1f2b3c4d5e6f
                  title: Math class
                  category: study
                  start_time: '08:00'
                  end_time: '09:30'
                  days: [0, 2]
              exceptions: []
              checkins: []
      responses:
        '200':
          description: What was created and what was already there.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [todos, schedule_items, exceptions, checkins, daily_intentions]
                    properties:
                      todos: {type: object, required: [created, skipped], properties: {created: {type: integer}, skipped: {type: integer}}}
                      schedule_items: {type: object, required: [created, skipped], properties: {created: {type: integer}, skipped: {type: integer}}}
                      exceptions: {type: object, required: [created, skipped], properties: {created: {type: integer}, skipped: {type: integer}}}
                      checkins: {type: object, required: [created, skipped], properties: {created: {type: integer}, skipped: {type: integer}}}
                      focus_sessions: {type: object, description: Returned when the request includes focus_sessions., required: [created, skipped], properties: {created: {type: integer}, skipped: {type: integer}}}
                      notes: {type: object, description: Returned when the request includes notes., required: [created, skipped], properties: {created: {type: integer}, skipped: {type: integer}}}
                      daily_intentions: {type: object, required: [created, skipped], properties: {created: {type: integer}, skipped: {type: integer}}}
              example:
                data:
                  todos: {created: 1, skipped: 0}
                  schedule_items: {created: 1, skipped: 0}
                  exceptions: {created: 0, skipped: 0}
                  checkins: {created: 0, skipped: 0}
                  daily_intentions: {created: 0, skipped: 0}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: A Focus session ID conflicts with an existing session. Nothing in the request is imported.
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Sanctum personal access token from register or login. Expires after 30 days.

  parameters:
    GoogleDeletionOrigin:
      name: Origin
      in: header
      required: true
      description: Exact canonical frontend origin.
      schema:
        type: string


    DateQuery:
      name: date
      in: query
      required: true
      description: The user's local date.
      schema:
        type: string
        format: date
    DatePath:
      name: date
      in: path
      required: true
      schema:
        type: string
        format: date
    ScheduleItemId:
      name: item
      in: path
      required: true
      description: Schedule item UUID. A value that is not a UUID returns 404.
      schema:
        type: string
        format: uuid
    FocusSessionId:
      name: focusSession
      in: path
      required: true
      description: Focus session UUID. A value that is not a UUID returns 404.
      schema:
        type: string
        format: uuid
    TodoId:
      name: todo
      in: path
      required: true
      description: To-do UUID. A value that is not a UUID returns 404.
      schema:
        type: string
        format: uuid

  schemas:
    StatsMetrics:
      type: object
      required: [focus_ms, break_ms, sessions, todos_done, todos_due, planned_block_minutes, blocks_checked, focus_ms_linked, focus_ms_unplanned]
      properties:
        focus_ms: { type: integer, format: int64, minimum: 0 }
        break_ms: { type: integer, format: int64, minimum: 0 }
        sessions: { type: integer, minimum: 0 }
        todos_done: { type: integer, minimum: 0 }
        todos_due: { type: integer, minimum: 0 }
        planned_block_minutes: { type: integer, minimum: 0 }
        blocks_checked: { type: integer, minimum: 0 }
        focus_ms_linked: { type: integer, format: int64, minimum: 0 }
        focus_ms_unplanned: { type: integer, format: int64, minimum: 0 }
    NoteFields:
      type: object
      properties:
        title: { type: [string, 'null'], maxLength: 120 }
        body: { type: [string, 'null'], maxLength: 10000 }
        schedule_item_id: { type: [string, 'null'], format: uuid }
        local_date: { type: [string, 'null'], format: date }
    NoteInput:
      allOf:
        - $ref: '#/components/schemas/NoteFields'
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    NoteImportInput:
      allOf:
        - $ref: '#/components/schemas/NoteInput'
        - type: object
          properties:
            created_at: { type: [string, 'null'], format: date-time }
            updated_at: { type: [string, 'null'], format: date-time }
    Note:
      allOf:
        - $ref: '#/components/schemas/NoteInput'
        - type: object
          required: [title, body, schedule_item_id, local_date, created_at, updated_at]
          properties:
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    GoogleDeletionBrowserSecret:
      type: string
      minLength: 43
      maxLength: 43
      pattern: '^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'
      description: Unpadded base64url encoding of 32 bytes.

    Occurrence:
      type: object
      required: [item_id, date, title, category, start_time, end_time, done, overridden]
      properties:
        item_id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        title:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        start_time:
          $ref: '#/components/schemas/Time'
        end_time:
          $ref: '#/components/schemas/Time'
        done:
          type: boolean
        overridden:
          type: boolean
          description: True when a one-day override changed this occurrence.
    Time:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      description: Local time, `HH:MM` (24 h).
      examples: ['08:00']

    Weekdays:
      type: array
      minItems: 1
      maxItems: 7
      uniqueItems: true
      description: Weekdays the item repeats on. 0 = Monday ... 6 = Sunday.
      items:
        type: integer
        minimum: 0
        maximum: 6

    ScheduleItemInput:
      type: object
      required: [title, start_time, end_time, days]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        category:
          $ref: '#/components/schemas/Category'
          description: Defaults to `other`.
        start_time:
          $ref: '#/components/schemas/Time'
        end_time:
          $ref: '#/components/schemas/Time'
        days:
          $ref: '#/components/schemas/Weekdays'
        starts_on:
          type: string
          format: date
          description: Defaults to today in the user's time zone.
        ends_on:
          type: [string, 'null']
          format: date
          description: Must be on or after `starts_on`.

    ScheduleItem:
      type: object
      required: [id, title, category, start_time, end_time, days, starts_on, ends_on, created_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        start_time:
          $ref: '#/components/schemas/Time'
        end_time:
          $ref: '#/components/schemas/Time'
        days:
          $ref: '#/components/schemas/Weekdays'
        starts_on:
          type: string
          format: date
        ends_on:
          type: [string, 'null']
          format: date
        created_at:
          type: string
          format: date-time

    Category:
      type: string
      enum: [study, work, health, life, rest, other]

    RegisterRequest:
      type: object
      required: [name, email, password, timezone]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 255
          description: Stored lower-case. Must be unique.
        password:
          type: string
          minLength: 8
        timezone:
          type: string
          description: IANA time zone name.
          examples: [Asia/Phnom_Penh]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    User:
      type: object
      required: [id, name, email, has_password, email_verified_at, timezone, time_format, week_starts_on, goal, heard_from, survey_done, current_streak, longest_streak, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        has_password:
          type: boolean
          description: False for an account created with Google that never set a password.
        email_verified_at:
          type: [string, 'null']
          format: date-time
        timezone:
          type: string
        time_format:
          type: string
          enum: ['12h', '24h']
          default: 24h
        week_starts_on:
          type: integer
          minimum: 1
          maximum: 7
          default: 1
          description: First day of the week, 1 = Monday to 7 = Sunday.
        goal:
          type: [string, 'null']
          enum: [be_consistent, manage_time, finish_tasks, other, null]
        heard_from:
          type: [string, 'null']
        survey_done:
          type: boolean
        current_streak:
          type: integer
          minimum: 0
        longest_streak:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time

    TokenResponse:
      type: object
      required: [token, expires_at, user]
      description: Returned by register and login. Note the user is NOT wrapped in `data` here.
      properties:
        token:
          type: string
          description: "Send as `Authorization: Bearer <token>`."
        expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'

    TodoInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Leading and trailing spaces are trimmed.
        category:
          $ref: '#/components/schemas/Category'
          description: Defaults to `other`.
        due_date:
          type: [string, 'null']
          format: date
          description: Not allowed on a subtask.
        priority:
          $ref: '#/components/schemas/Priority'
        notes:
          type: [string, 'null']
          maxLength: 2000
        parent_id:
          type: [string, 'null']
          format: uuid
          description: Makes this a subtask of one of the user's top-level to-dos. Only on create.
        repeat_rule:
          oneOf:
            - $ref: '#/components/schemas/RepeatRule'
            - type: 'null'
          description: Needs a `due_date`. Not allowed on a subtask.
        remind_at:
          $ref: '#/components/schemas/RemindAt'

    RemindAt:
      type: [string, 'null']
      format: date-time
      description: |
        When to remind, as ISO 8601 with an explicit offset (`2026-10-24T18:30:00+07:00` or `2026-10-24T11:30:00.000Z`).
        A value without an offset is a 422. Stored and returned in UTC. Not allowed on a subtask.
      example: '2026-10-24T11:30:00Z'

    RepeatRule:
      type: object
      description: |
        `{type: daily}` or `{type: weekly, days: [...]}`. Days use the schedule numbers (0 = Monday ... 6 = Sunday);
        they are returned sorted. `days` is ignored for `daily`.
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [daily, weekly]
        days:
          $ref: '#/components/schemas/Weekdays'
      example:
        type: weekly
        days: [0, 2, 4]

    Priority:
      type: string
      enum: [low, normal, high]
      default: normal

    Todo:
      type: object
      required: [id, title, category, priority, notes, parent_id, repeat_rule, next_todo_id, remind_at, due_date, done_at, overdue, old, created_at, subtasks]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        priority:
          $ref: '#/components/schemas/Priority'
        notes:
          type: [string, 'null']
        parent_id:
          type: [string, 'null']
          format: uuid
          description: Set on a subtask. Subtasks are one level deep.
        repeat_rule:
          oneOf:
            - $ref: '#/components/schemas/RepeatRule'
            - type: 'null'
        next_todo_id:
          type: [string, 'null']
          format: uuid
          description: Set when a repeating to-do is first checked off; the to-do created for the next date.
        remind_at:
          type: [string, 'null']
          format: date-time
          description: When the in-app reminder is due, in UTC. Always null on a subtask.
        due_date:
          type: [string, 'null']
          format: date
        done_at:
          type: [string, 'null']
          format: date-time
        overdue:
          type: boolean
          description: Computed. Due before the user's today and not done.
        old:
          type: boolean
          description: Computed. Overdue for more than 30 days.
        created_at:
          type: string
          format: date-time
        subtasks:
          type: array
          description: The to-do's subtasks, oldest first. Always empty on a subtask.
          items:
            $ref: '#/components/schemas/Todo'

    FocusSessionSegment:
      type: object
      additionalProperties: false
      required: [type, started_at, ended_at, active_ms]
      description: |
        One phase. Segments are in order, do not overlap and stay inside the session. `active_ms` excludes pauses
        and is at most `ended_at - started_at` of the segment.
      properties:
        type:
          type: string
          enum: [focus, short_break, long_break]
          description: Breaks are allowed in countdown sessions only.
        started_at:
          $ref: '#/components/schemas/FocusTimestamp'
        ended_at:
          $ref: '#/components/schemas/FocusTimestamp'
        active_ms:
          type: integer
          minimum: 0

    FocusTimestamp:
      type: string
      format: date-time
      description: ISO 8601 with an explicit offset (`Z` or `+07:00`), millisecond precision. Responses are UTC with milliseconds.
      example: '2026-11-23T02:00:00.000Z'

    FocusSessionInput:
      type: object
      required: [id, mode, started_at, ended_at, end_reason, segments]
      properties:
        id:
          type: string
          format: uuid
          description: Generated by the client when the timer starts; reuse it for every retry.
        mode:
          type: string
          enum: [countdown, stopwatch]
        started_at:
          $ref: '#/components/schemas/FocusTimestamp'
        ended_at:
          allOf:
            - $ref: '#/components/schemas/FocusTimestamp'
          description: Not before `started_at`. Never compared with the server clock (see the operation description).
        end_reason:
          type: string
          enum: [completed, ended_early]
        planned_focus_ms:
          type: [integer, 'null']
          minimum: 1
          description: Countdown only (required); the length of one focus phase, such as 1500000 for a 25 min preset. Stopwatch sends null or leaves it out.
        todo_id:
          type: [string, 'null']
          format: uuid
          description: The user's own to-do. Only one of `todo_id` and `schedule_item_id` may be set.
        schedule_item_id:
          type: [string, 'null']
          format: uuid
          description: The user's own existing schedule item.
        label:
          type: [string, 'null']
          maxLength: 200
          description: Snapshot of the linked item's title, kept if the link goes away. Up to 200 characters, the same as to-do and schedule item titles (B-045).
        segments:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/FocusSessionSegment'
        laps:
          type: [array, 'null']
          maxItems: 1000
          description: Stopwatch only. Cumulative active milliseconds, strictly increasing, the last at most `focus_ms`.
          items:
            type: integer
            minimum: 1

    FocusSession:
      type: object
      required: [id, mode, end_reason, started_at, ended_at, local_date, planned_focus_ms, focus_ms, break_ms, paused_ms, todo_id, schedule_item_id, label, segments, laps, created_at]
      properties:
        id: {type: string, format: uuid}
        mode: {type: string, enum: [countdown, stopwatch]}
        end_reason: {type: string, enum: [completed, ended_early]}
        started_at:
          $ref: '#/components/schemas/FocusTimestamp'
        ended_at:
          $ref: '#/components/schemas/FocusTimestamp'
        local_date:
          type: string
          format: date
          description: The local date of `started_at` in the user's time zone.
        planned_focus_ms: {type: [integer, 'null']}
        focus_ms:
          type: integer
          description: Tracked Focus time; active time in focus segments only.
        break_ms: {type: integer}
        paused_ms: {type: integer}
        todo_id: {type: [string, 'null'], format: uuid}
        schedule_item_id:
          type: [string, 'null']
          format: uuid
          description: Becomes null when the schedule item is deleted; the session stays.
        label: {type: [string, 'null']}
        segments:
          type: array
          items:
            $ref: '#/components/schemas/FocusSessionSegment'
        laps: {type: [array, 'null'], items: {type: integer}}
        created_at: {type: string, format: date-time}

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string

    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

  responses:
    GoogleDeletionForbidden:
      description: The Google deletion operation requires the exact canonical frontend Origin.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    GoogleDeletionJsonRequired:
      description: The Google deletion operation requires a JSON request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    GoogleDeletionFailure:
      description: The Google deletion operation failed unexpectedly.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    GoogleDeletionUnavailable:
      description: Google deletion is disabled, missing provider configuration or temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    GoogleDeletionValidationError:
      description: The submitted fields are malformed or the Google confirmation is invalid or expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'


    CheckinResponse:
      description: The check-in.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [item_id, date, done, done_at]
                properties:
                  item_id:
                    type: string
                    format: uuid
                  date:
                    type: string
                    format: date
                  done:
                    type: boolean
                  done_at:
                    type: string
                    format: date-time
    ScheduleItemResponse:
      description: The schedule item, wrapped in `data`.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/ScheduleItem'
          example:
            data:
              id: 4e2a1b3c-5d6e-4f70-8a9b-0c1d2e3f4a5b
              title: Math class
              category: study
              start_time: '08:00'
              end_time: '09:30'
              days: [0, 2, 4]
              starts_on: '2026-10-25'
              ends_on: null
              created_at: '2026-10-24T23:30:00Z'
    MeResponse:
      description: The current user, wrapped in `data`.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/User'
    Message:
      description: Done. A human-readable message.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: If an account exists for that email, we sent a reset link.
    IntentionResponse:
      description: The day's intention, wrapped in `data`.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [date, text]
                properties:
                  date:
                    type: string
                    format: date
                  text:
                    type: [string, 'null']
                    maxLength: 200
          example:
            data:
              date: '2026-10-24'
              text: Finish the essay outline
    TodoResponse:
      description: The to-do, wrapped in `data`.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/Todo'
    FocusSessionResponse:
      description: One Focus session.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/FocusSession'
          example:
            data:
              id: 6f1c2a8e-3b4d-4e5f-8a9b-0c1d2e3f4a5b
              mode: countdown
              end_reason: completed
              started_at: '2026-11-23T02:00:00.000Z'
              ended_at: '2026-11-23T03:02:30.000Z'
              local_date: '2026-11-23'
              planned_focus_ms: 1500000
              focus_ms: 3000000
              break_ms: 300000
              paused_ms: 450000
              todo_id: 1a2b3c4d-0000-4000-8000-000000000001
              schedule_item_id: null
              label: Read chapter 4
              segments:
                - {type: focus, started_at: '2026-11-23T02:00:00.000Z', ended_at: '2026-11-23T02:27:00.000Z', active_ms: 1500000}
                - {type: short_break, started_at: '2026-11-23T02:27:00.000Z', ended_at: '2026-11-23T02:32:00.000Z', active_ms: 300000}
                - {type: focus, started_at: '2026-11-23T02:32:00.000Z', ended_at: '2026-11-23T03:02:30.000Z', active_ms: 1500000}
              laps: null
              created_at: '2026-11-23T03:02:31Z'
    ValidationError:
      description: Invalid input.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            message: The title field is required.
            errors:
              title: [The title field is required.]
    Unauthenticated:
      description: Missing, invalid or expired token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Unauthenticated.
    Forbidden:
      description: The item belongs to another user.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: This action is unauthorized.
    NotFound:
      description: No such item.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Not found.
    TooManyRequests:
      description: Rate limit hit. Retry after the `Retry-After` header.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Too Many Attempts.

  examples:
    MeResponse:
      value:
        data:
          id: 9f1c2d3e-4b5a-4c6d-8e7f-0a1b2c3d4e5f
          name: Sokha
          email: sokha@example.com
          has_password: true
          email_verified_at: null
          timezone: Asia/Phnom_Penh
          time_format: 24h
          week_starts_on: 1
          goal: null
          heard_from: null
          survey_done: false
          current_streak: 0
          longest_streak: 0
          created_at: '2026-10-24T03:00:00Z'
    TokenResponse:
      value:
        token: 1|Xb7kQ2...
        expires_at: '2026-11-23T03:00:00Z'
        user:
          id: 9f1c2d3e-4b5a-4c6d-8e7f-0a1b2c3d4e5f
          name: Sokha
          email: sokha@example.com
          has_password: true
          email_verified_at: null
          timezone: Asia/Phnom_Penh
          time_format: 24h
          week_starts_on: 1
          goal: null
          heard_from: null
          survey_done: false
          current_streak: 0
          longest_streak: 0
          created_at: '2026-10-24T03:00:00Z'
