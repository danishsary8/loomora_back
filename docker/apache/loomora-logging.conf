# One access record per request across the server and its virtual hosts.
# %U logs the path without the query string. The PHP image routes access.log to stdout.
GlobalLog ${APACHE_LOG_DIR}/access.log "%t %m %U %>s %B"

# The default Apache error formatter appends Referer to request diagnostics.
ErrorLogFormat "[%{u}t] [%-m:%l] [pid %P:tid %T] %7F: %E: [client\ %a] %M"
