name: CI

on:
  pull_request:
  push:
    branches: [main, v2-rebuild]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: loomora
          POSTGRES_PASSWORD: loomora
          POSTGRES_DB: loomora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_CONNECTION: pgsql
      DB_URL: pgsql://loomora:loomora@127.0.0.1:5432/loomora_test

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, mbstring
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint
        run: ./vendor/bin/pint --test

      - name: PHPStan
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Tests
        run: php artisan test

  docker:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: loomora
          POSTGRES_PASSWORD: loomora
          POSTGRES_DB: loomora
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t loomora-api .

      - name: Start container, migrations run and health answers
        run: |
          docker run -d --name api --network host \
            -e APP_KEY="base64:$(openssl rand -base64 32)" \
            -e DB_CONNECTION=pgsql \
            -e DB_URL=pgsql://loomora:loomora@127.0.0.1:5432/loomora \
            -e PORT=10000 \
            loomora-api
          for i in $(seq 30); do
            curl -fsS http://127.0.0.1:10000/api/v1/health && exit 0
            sleep 2
          done
          docker logs api
          exit 1

      - name: Container refuses to start when migrations fail
        run: |
          set +e
          docker run --name bad --network host \
            -e APP_KEY="base64:$(openssl rand -base64 32)" \
            -e DB_CONNECTION=pgsql \
            -e DB_URL=pgsql://nobody:wrong@127.0.0.1:5432/missing \
            -e PGCONNECT_TIMEOUT=2 \
            loomora-api
          code=$?
          docker logs bad 2>&1 | tail -5
          docker logs bad 2>&1 | grep -q "FATAL: migrations failed" || exit 1
          test "$code" -ne 0
